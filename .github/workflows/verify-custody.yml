name: verify-custody

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read
  checks: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch this commit's qualified bytes
        id: custody
        uses: ./actions/qualified-fetch
        with:
          directory: ${{ runner.temp }}/qualified-payloads
      - name: Verify every payload byte
        env:
          CUSTODY_DIRECTORY: ${{ steps.custody.outputs.directory }}
          CUSTODY_IMAGES: ${{ steps.custody.outputs.images }}
          CUSTODY_DIGEST: ${{ steps.custody.outputs.digest }}
        run: |
          set -euo pipefail
          test -z "$CUSTODY_IMAGES"
          test -n "$CUSTODY_DIGEST"
          python3 -B ci/fixtures.py verify "$CUSTODY_DIRECTORY"
